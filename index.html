<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relève</title>
<meta name="description" content="Locum shifts across Canada, checked against your provincial licences, CMPA cover and course dates before you book.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<meta property="og:title" content="Relève">
<meta property="og:description" content="Locum shifts across Canada, checked against your licences and CMPA cover before you book. / Des remplacements partout au Canada.">
<style>html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: marketing page in a 1200px measure with alternating two-column bands; app is a top-tabbed shell with list/detail split views */
/* Palette: Canadian red (FIP red, Pantone 032, for the mark; a deeper accessible red for actions), federal-service navy for text, snow and glacier neutrals */
:root{
  --paper:#ffffff; --wash:#f4f6f8; --wash-2:#e6edf2; --ink:#1b2a3a; --ink-2:#465668; --ink-3:#66768a; --line:#d6dee6;
  --flag:#eb2d37; --brand:#c8102e; --brand-wash:#fbe9eb; --navy:#1b2a3a; --navy-ink:#ffffff;
  --act:#c8102e; --act-ink:#ffffff; --act-hover:#a90d26;
  --ok:#16764a; --ok-wash:#e4f2ea; --warn:#8f5406; --warn-wash:#fbf0dc; --bad:#9e1b32; --bad-wash:#f9e6e9; --info:#2f4a6b;
  --f-head:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 1px 2px rgb(22 27 38/.06),0 18px 40px -18px rgb(22 27 38/.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1720; --wash:#152130; --wash-2:#1c2a3b; --ink:#edf1f5; --ink-2:#b6c1cd; --ink-3:#8e9bab; --line:#26364a;
  --flag:#eb2d37; --brand:#ff7a82; --brand-wash:#3a1d24; --navy:#0a121b; --navy-ink:#edf1f5;
  --act:#c8102e; --act-ink:#ffffff; --act-hover:#e0233f;
  --ok:#6fcf9b; --ok-wash:#16301f; --warn:#f0b866; --warn-wash:#352812; --bad:#ff8f8f; --bad-wash:#3a1b1e; --info:#a9bfdc;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 18px 40px -18px rgb(0 0 0/.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1720; --wash:#152130; --wash-2:#1c2a3b; --ink:#edf1f5; --ink-2:#b6c1cd; --ink-3:#8e9bab; --line:#26364a;
  --flag:#eb2d37; --brand:#ff7a82; --brand-wash:#3a1d24; --navy:#0a121b; --navy-ink:#edf1f5;
  --act:#c8102e; --act-ink:#ffffff; --act-hover:#e0233f;
  --ok:#6fcf9b; --ok-wash:#16301f; --warn:#f0b866; --warn-wash:#352812; --bad:#ff8f8f; --bad-wash:#3a1b1e; --info:#a9bfdc;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 18px 40px -18px rgb(0 0 0/.6); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:6px;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.btn.primary:hover{background:var(--act-hover);border-color:var(--act-hover)}
.btn.quiet{border-color:transparent;background:transparent;padding-inline:10px}
.btn.quiet:hover{background:var(--wash)}
.btn.lg{padding:14px 22px;font-size:1rem}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-3);cursor:pointer}
.link:hover{text-decoration-color:var(--ink)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--flag)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.mark svg{flex:none}
.topnav{display:flex;gap:4px;flex:1}
.topnav button{background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:700;font-size:.93rem}
.topnav button:hover{color:var(--ink);background:var(--wash)}
.topnav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand);border-radius:0}
.top-right{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 9px;font-size:.8rem;font-weight:700;color:var(--ink-3);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--wash-2);color:var(--ink)}
.menu-btn{display:none}
.lang-link .short,.show-sm{display:none}
.demo-strip{background:var(--wash);border-bottom:1px solid var(--line);font-size:.85rem;color:var(--ink-2)}
.demo-strip .wrap{padding-block:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- Marketing ---------- */
.hero{padding-block:72px 64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:64px;align-items:center}
.hero h1{hyphens:auto;font-size:clamp(2.1rem,5.2vw,4.1rem);line-height:1.02;letter-spacing:-.035em;font-weight:800}
.hero .lede{font-size:1.2rem;line-height:1.55;color:var(--ink-2);margin-top:22px;max-width:34em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero .fine{margin-top:18px;font-size:.9rem;color:var(--ink-3)}

.check-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.cc-head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}
.cc-head .where{color:var(--ink-2);font-size:.95rem;margin-top:2px}
.cc-head h3{font-size:1.25rem;letter-spacing:-.01em}
.cc-facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;padding:18px 24px;border-bottom:1px solid var(--line)}
.cc-facts dt{font-size:.8rem;color:var(--ink-3)}
.cc-facts dd{margin:2px 0 0;font-weight:700}
.cc-facts .big{font-family:var(--f-head);font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.cc-checks{list-style:none;margin:0;padding:12px 24px 6px}
.cc-checks li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:9px 0;align-items:start;font-size:.95rem}
.cc-checks li + li{border-top:1px dashed var(--line)}
.cc-foot{padding:16px 24px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--wash)}
.cc-foot p{font-size:.9rem;color:var(--ink-2);max-width:26em}
@media (prefers-reduced-motion:no-preference){
  .cc-checks li{animation:settle .5s ease both}
  .cc-checks li:nth-child(1){animation-delay:.35s}.cc-checks li:nth-child(2){animation-delay:.7s}
  .cc-checks li:nth-child(3){animation-delay:1.05s}.cc-checks li:nth-child(4){animation-delay:1.4s}
  .cc-foot{animation:settle .5s ease 1.8s both}
  @keyframes settle{from{opacity:.28}to{opacity:1}}
}

.band{background:var(--wash);border-block:1px solid var(--line)}
.regs{padding-block:28px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.regs p{font-weight:700;max-width:22em}
.regs ul{display:flex;flex-wrap:wrap;gap:6px 22px;list-style:none;margin:0;padding:0;flex:1;color:var(--ink-2);font-family:var(--f-head);font-weight:600}

.sec{padding-block:96px}
.sec-head{max-width:40em}
.sec-head h2{font-size:clamp(1.9rem,3.4vw,2.7rem);line-height:1.08;letter-spacing:-.03em;font-weight:800}
.sec-head p{margin-top:16px;font-size:1.1rem;color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:56px;counter-reset:s;list-style:none;padding:0}
.steps li{border-top:2px solid var(--ink);padding-top:20px}
.steps .n{font-family:var(--f-head);font-weight:800;font-size:.95rem;color:var(--brand)}
.steps h3{font-size:1.3rem;margin-top:6px;letter-spacing:-.01em}
.steps p{margin-top:10px;color:var(--ink-2)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:start;margin-top:56px}
.feat{display:grid;gap:30px}
.feat h3{font-size:1.15rem}
.feat p{color:var(--ink-2);margin-top:6px}
.mini{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.mini-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mini-h b{font-family:var(--f-head)}
.mini table{width:100%;border-collapse:collapse;font-size:.9rem}
.mini td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:top}
.mini tr:last-child td{border-bottom:0}
.mini .why{color:var(--ink-2);font-size:.82rem;margin-top:2px}

.law{margin-top:48px;border-top:2px solid var(--ink)}
.law-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding:24px 0;border-bottom:1px solid var(--line)}
.law-row h3{font-size:1.05rem}
.law-row p{color:var(--ink-2);max-width:62ch}
.law-note{margin-top:20px;font-size:.88rem;color:var(--ink-3);max-width:62ch}

.price{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:48px}
.plan{border:1px solid var(--line);border-radius:10px;padding:32px;display:flex;flex-direction:column;gap:16px}
.plan.dark{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.plan.dark h3,.plan.dark .muted{color:var(--navy-ink)}
.plan.dark .muted{opacity:.75}
.plan .amt{font-family:var(--f-head);font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.plan ul{margin:0;padding-left:20px;display:grid;gap:6px}
.plan .btn{align-self:flex-start;margin-top:auto;white-space:normal;text-align:left}
.plan{min-width:0}
.plan.dark .btn{background:var(--act);color:var(--act-ink);border-color:var(--act)}

/* Photography */
.ph{margin:0;position:relative;overflow:hidden;background:var(--wash-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero-visual{position:relative;display:grid}
.hero-ph{border-radius:12px;aspect-ratio:1/1}
.hero-ph figcaption{position:absolute;top:14px;right:14px;font-size:.75rem;color:#fff;background:rgb(16 26 38/.55);padding:4px 9px;border-radius:4px}
.hero-ph figcaption a{color:inherit}
.hero-visual .check-card{position:relative;margin:-300px 0 0 -72px;width:calc(100% - 40px)}
.hero-visual.nophoto .hero-ph{display:none}
.hero-visual.nophoto .check-card{margin:0;width:auto}
.coast{padding-block:72px;background:var(--wash);border-block:1px solid var(--line)}
.coast-head{display:flex;justify-content:space-between;gap:16px 48px;align-items:flex-end;flex-wrap:wrap}
.coast-head h2{font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.1;letter-spacing:-.03em;font-weight:800;max-width:16em}
.coast-head p{color:var(--ink-2);max-width:30em}
.coast-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
.tile{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--wash-2)}
.tile figcaption{padding:14px 16px 16px;display:grid;gap:3px;border-top:3px solid var(--flag)}
.tile figcaption b{font-family:var(--f-head);font-size:1.05rem}
.tile figcaption span{font-size:.9rem;color:var(--ink-2)}
.tile figcaption small{font-size:.75rem;color:var(--ink-3)}
.tile figcaption small a{color:inherit}
.tile.nophoto img{display:none}
.regs-list{display:flex;flex-wrap:wrap;gap:6px 22px;list-style:none;margin:28px 0 0;padding:0;color:var(--ink-2);font-family:var(--f-head);font-weight:600}
.side-ph{border-radius:10px;aspect-ratio:16/9;margin-bottom:36px}
.side-ph.nophoto{display:none}
.side-ph figcaption{position:absolute;bottom:10px;right:12px;font-size:.75rem;color:#fff;background:rgb(16 26 38/.55);padding:3px 8px;border-radius:4px}
.side-ph figcaption a{color:inherit}
.credits{font-size:.8rem;color:var(--ink-3);margin-top:12px;max-width:72ch}
.credits a{color:inherit}

.foot{border-top:1px solid var(--line);padding-block:40px;color:var(--ink-3);font-size:.9rem}
.foot .wrap{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.foot .credits{flex-basis:100%}

/* ---------- Auth ---------- */
.auth{min-height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-main{padding:64px max(24px,env(safe-area-inset-left,0px)) 64px;display:flex;justify-content:center}
.auth-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}
.auth-box h1{font-size:2rem;letter-spacing:-.03em}
.auth-side{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:64px max(48px,env(safe-area-inset-right,0px)) 48px 48px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:420px}
.auth-side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.auth-side::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(16 26 38/.15) 0%,rgb(16 26 38/.55) 45%,rgb(16 26 38/.92) 100%)}
.auth-side > :not(img){position:relative;z-index:1}
.auth-side.nophoto img{display:none}
.auth-side blockquote{margin:0;font-family:var(--f-head);font-size:1.5rem;line-height:1.3;letter-spacing:-.015em;font-weight:600;max-width:24em;color:#fff}
.auth-side .muted{color:rgb(255 255 255/.78)}
.credit{font-size:.75rem;color:rgb(255 255 255/.7)}
.credit a{color:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;padding:3px;gap:3px;background:var(--wash)}
.seg button{border:0;background:none;padding:8px;border-radius:5px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field .hint{font-size:.82rem;color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.persona{display:grid;gap:8px}
.persona button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:14px 16px;cursor:pointer}
.persona button:hover{border-color:var(--ink-3)}
.persona b{font-family:var(--f-head)}
.persona span{grid-column:1;font-size:.86rem;color:var(--ink-2)}
.persona i{grid-row:1/3;grid-column:2;font-style:normal;color:var(--ink-3);font-size:.85rem}
.err{color:var(--bad);font-size:.9rem}
.ok-msg{color:var(--ok);font-size:.9rem}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- App ---------- */
.app{padding-block:32px 80px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-h h1{font-size:1.85rem;letter-spacing:-.025em}
.page-h p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.toolbar select{width:auto}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.tgl input{width:16px;height:16px;accent-color:var(--act)}
.count{margin-left:auto;font-size:.9rem;color:var(--ink-2)}

.sv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:20px;min-height:560px}
.sv-list{border-right:1px solid var(--line);overflow:auto;max-height:78vh}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 14px;width:100%;text-align:left;padding:16px 18px;border:0;border-bottom:1px solid var(--line);background:var(--paper);cursor:pointer;align-items:start}
.row:hover{background:var(--wash)}
.row[aria-selected="true"]{background:var(--wash-2)}
.row .t{font-weight:700;font-family:var(--f-head);font-size:1rem}
.row .s{color:var(--ink-2);font-size:.88rem;grid-column:2}
.row .r{grid-column:3;grid-row:1/3;text-align:right}
.row .r b{font-family:var(--f-head);font-size:1.05rem;display:block}
.row .r span{font-size:.8rem;color:var(--ink-3)}
.row .flag{color:var(--bad);font-size:.8rem;font-weight:700;margin-left:8px;font-family:var(--f-body)}
.sv-detail{padding:28px;overflow:auto;max-height:78vh;display:flex;flex-direction:column;gap:22px}
.sv-detail h2{font-size:1.5rem;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;margin:0}
.facts dt{font-size:.82rem;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-weight:700}
.checks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:12px 14px;font-size:.95rem}
.checks li + li{border-top:1px solid var(--line)}
.ic{width:20px;height:20px;flex:none;margin-top:1px}
.ic.ok{color:var(--ok)} .ic.warn{color:var(--warn)} .ic.bad{color:var(--bad)} .ic.info{color:var(--info)}
.verdict{padding:14px 16px;border-radius:8px;font-size:.95rem}
.verdict.ok{background:var(--ok-wash)} .verdict.warn{background:var(--warn-wash)} .verdict.bad{background:var(--bad-wash)}
.terms{font-size:.92rem;color:var(--ink-2);display:grid;gap:6px;margin:0;padding-left:18px}
.terms b{color:var(--ink)}
.book-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line);margin-top:auto}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th{text-align:left;font-weight:700;font-size:.82rem;color:var(--ink-2);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--wash);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .sub{color:var(--ink-3);font-size:.84rem;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;white-space:nowrap}
.tag .ic{width:16px;height:16px;margin:0}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.info{color:var(--info)} .tag.mute{color:var(--ink-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.group{display:grid;gap:12px;margin-top:32px}
.group h2{font-size:1.15rem}
.empty{padding:40px 24px;text-align:center;color:var(--ink-2);display:grid;gap:12px;justify-items:center}
.stats{display:flex;gap:40px;flex-wrap:wrap;padding:4px 0 24px}
.stats div{display:grid}
.stats b{font-family:var(--f-head);font-size:1.6rem;letter-spacing:-.02em}
.stats span{font-size:.86rem;color:var(--ink-2)}
.notice{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-wash);padding:12px 16px;border-radius:6px;font-size:.93rem;margin-bottom:20px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.panel{border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:12px;align-content:start}
.panel h2{font-size:1.15rem}
.panel ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.cand:last-child{border-bottom:0}
.cand .nm{font-family:var(--f-head);font-weight:700}
.cand .why{display:flex;flex-wrap:wrap;gap:4px 14px;grid-column:1}
.cand .sc{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:12px}
.meter{width:72px;height:6px;background:var(--wash-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:90vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgb(17 20 27/.5)}
.dlg{padding:28px;display:grid;gap:18px;overflow:auto;max-height:90vh}
.dlg h2{font-size:1.35rem;letter-spacing:-.02em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
pre.json{background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:.78rem;max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:12px 18px;border-radius:8px;font-weight:700;font-size:.93rem;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.loading{padding:48px;text-align:center;color:var(--ink-3)}

@media (max-width:960px){
  .hero .wrap,.split,.auth{grid-template-columns:1fr}
  .hero .wrap{gap:48px}
  .steps{grid-template-columns:1fr;gap:28px}
  .coast-grid{grid-template-columns:1fr 1fr}
  .hero-visual .check-card{margin:-160px 16px 0;width:auto}
  .hero-ph{aspect-ratio:4/3}
  .auth-side{padding:40px max(24px,env(safe-area-inset-left,0px)) 32px;min-height:340px}
  .sv{grid-template-columns:1fr}
  .sv-list{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .sv-detail{max-height:none}
  .cols,.price{grid-template-columns:1fr}
}
@media (max-width:720px){
  .topnav{display:none}
  .topnav.open{display:flex;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px));gap:2px}
  .topnav.open button{text-align:left;padding:12px 8px}
  .topnav.open button[aria-current="page"]{box-shadow:none;background:var(--wash)}
  .menu-btn{display:inline-flex}
  .top .wrap{gap:12px}
  .top-right .hide-sm{display:none}
  .lang-link .long{display:none} .lang-link .short{display:inline}
  .topnav.open .show-sm{display:block}
  .top-right{gap:4px}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{padding-block:44px 48px}
  .sec{padding-block:64px}
  .law-row{grid-template-columns:1fr;gap:6px}
  .plan{padding:24px}
  .cc-facts,.facts,.form-grid{grid-template-columns:1fr}
  .coast-grid{grid-template-columns:1fr}
  .hero-visual .check-card{margin:-90px 10px 0}
  .sv-detail{padding:20px}
  .row{grid-template-columns:22px minmax(0,1fr)}
  .row .r{grid-column:2;grid-row:auto;text-align:left;display:flex;gap:8px;align-items:baseline}
  .row .r b{display:inline}
  .cand{grid-template-columns:1fr}
  .cand .sc{grid-row:auto;grid-column:1}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (max-width:350px){.mark span{display:none}.hero h1{font-size:1.9rem}}

const REASON_FR = [

  [/^Needs CPSO registration through automatic recognition before start$/, ()=>"Inscription au CPSO par reconnaissance automatique requise avant le début"],
  [/^Needs a (.+) licence$/, m=>`Permis ${m[1]} requis`],
  [/^CMPA covers the dates$/, ()=>"L’ACPM couvre les dates"],
  [/^CMPA cover lapses before the shift ends$/, ()=>"La protection de l’ACPM prend fin avant la fin du remplacement"],
  [/^ACLS current$/, ()=>"ACLS à jour"],
  [/^ACLS renewal needed before start$/, ()=>"Renouvellement ACLS requis avant le début"],
  [/^Knows (.+)$/, m=>`Connaît ${m[1]}`],
  [/^Works in French$/, ()=>"Travaille en français"],

  [/^Account is (.+)$/, m=>`Compte ${({restricted:"restreint",suspended:"suspendu"})[m[1]]||m[1]}`]
];

function netOf(s){ const days=ndays(s.start_date,s.end_date); return Math.round(((s.pay_model==="per_diem") ? s.daily_rate*days : s.est_billings*(1-s.overhead_pct/100)) + (s.travel_allowance||0)); }
function demoElig(s, cid){
  const c=D.clinicians[cid], prov=D.clinics[s.clinic_id].province, col=PROV[prov].college;
  const cr=D.creds.filter(x=>x.clinician_id===cid && x.verification_status==="verified");
  let lvl="ok"; const rs=[]; const up=l=>{ if(lvl==="ok") lvl=l; }; const bad=m=>{ lvl="bad"; rs.push({k:"bad",t:m}); };
  if(c.standing!=="good") bad("Account is "+c.standing);
  const lic=cr.filter(x=>x.type==="licence" && x.province===prov);
  if(lic.length){ if(lic.some(x=>!x.expires_on || x.expires_on>=s.end_date)) rs.push({k:"ok",t:col+" licence verified"}); else bad(col+" licence expires before the shift ends"); }
  else if(prov==="ON" && cr.some(x=>x.type==="licence" && (!x.expires_on || x.expires_on>=s.end_date))){ up("warn"); rs.push({k:"warn",t:"Needs CPSO registration through automatic recognition before start"}); }
  else bad("Needs a "+col+" licence");
  if(cr.some(x=>x.type==="liability" && x.expires_on>=s.end_date)) rs.push({k:"ok",t:"CMPA covers the dates"}); else bad("CMPA cover lapses before the shift ends");
  if(s.requires_acls){ if(cr.some(x=>x.type==="course" && /ACLS/i.test(x.label) && x.expires_on>=s.end_date)) rs.push({k:"ok",t:"ACLS current"}); else { up("warn"); rs.push({k:"warn",t:"ACLS renewal needed before start"}); } }
  if(s.emr && c.emrs.includes(s.emr)) rs.push({k:"info",t:"Knows "+s.emr});
  if(s.language==="fr"){ if(c.languages.some(l=>/^fr/i.test(l))) rs.push({k:"info",t:"Works in French"}); else { up("warn"); rs.push({k:"warn",t:"French-language clinic"}); } }
  return {level:lvl,reasons:rs};
}

let sb = null;
const chk = ({data,error}) => { if(error) throw new Error(error.message); return data; };
const LiveAPI = {
  async signIn(email,pw){ chk(await sb.auth.signInWithPassword({email,password:pw})); S.me = await this.loadMe(); },
  async signUp(email,pw,name,role){ chk(await sb.auth.signUp({email,password:pw,options:{data:{full_name:name,role,lang:S.lang},emailRedirectTo:location.origin+location.pathname}})); },
  async signOut(){ await sb.auth.signOut(); S.me=null; },
  async loadMe(){
    const { data:{ user } } = await sb.auth.getUser(); if(!user) return null;
    const p = chk(await sb.from("profiles").select("*").eq("id",user.id).single());
    const c = p.role==="clinician" ? chk(await sb.from("clinicians").select("*").eq("id",user.id).maybeSingle()) : null;
    const m = chk(await sb.from("clinic_members").select("member_role, clinics(id,name,city,province)").eq("user_id",user.id));
    return {id:user.id, email:user.email, role:p.role, full_name:p.full_name, clinician:c, clinics:m.map(x=>x.clinics).filter(Boolean)};
  },
  async shiftBoard(){ return chk(await sb.rpc("shift_board")); },
  async book(sid){ return chk(await sb.rpc("book_shift",{p_shift:sid,p_accept_terms:true})); },
  async myBookings(){
    const rows = chk(await sb.from("bookings").select("*, shifts(*, clinics(name,city,province)), timesheets(*), invoices(*)").eq("clinician_id",S.me.id));
    return rows.map(b=>{ const s=b.shifts, c=s.clinics; return {...b, shift:{...s, clinic_name:c.name, city:c.city, province:c.province, days:ndays(s.start_date,s.end_date), net_estimate:netOf(s)}, timesheet:first(b.timesheets), invoice:first(b.invoices)}; })
      .sort((a,b)=>b.shift.start_date.localeCompare(a.shift.start_date));
  },
  async cancel(bid,reason){ chk(await sb.rpc("cancel_booking",{p_booking:bid,p_reason:reason})); },
  async submitTimesheet(bid,days,bill,notes,early){ chk(await sb.rpc("submit_timesheet",{p_booking:bid,p_days:days,p_billings:bill,p_notes:notes,p_early_pay:early})); },
  async credentials(){ return chk(await sb.from("credentials").select("*").eq("clinician_id",S.me.id).order("type")); },
  async addCredential(c){ chk(await sb.from("credentials").insert({...c, clinician_id:S.me.id})); },
  async standing(){ return { clinician: chk(await sb.from("clinicians").select("*").eq("id",S.me.id).single()), actions: chk(await sb.from("account_actions").select("*").eq("clinician_id",S.me.id).order("created_at",{ascending:false})) }; },
  async exportData(){ return chk(await sb.rpc("export_my_data")); },
  async requestDeletion(note){ chk(await sb.rpc("request_account_deletion",{p_note:note})); },
  async createClinic(x){ chk(await sb.from("clinics").insert(x)); S.me = await this.loadMe(); },
  async clinicShifts(){
    const ids=S.me.clinics.map(c=>c.id); if(!ids.length) return [];
    const rows = chk(await sb.from("shifts").select("*, clinics(name,city,province), bookings(id,status,clinicians(profiles(full_name)))").in("clinic_id",ids).order("start_date",{ascending:false}));
    return rows.map(s=>{ const b=(s.bookings||[]).find(x=>x.status!=="cancelled"); return {...s, clinic_name:s.clinics.name, city:s.clinics.city, province:s.clinics.province, days:ndays(s.start_date,s.end_date), net_estimate:netOf(s), booking:b?{id:b.id,status:b.status,clinician_name:b.clinicians?.profiles?.full_name||"Physician"}:null}; });
  },

  async rank(sid){ return chk(await sb.rpc("rank_candidates",{p_shift:sid})); },
  async invite(sid,cid){ chk(await sb.rpc("invite_clinician",{p_shift:sid,p_clinician:cid})); },
  async clinicTimesheets(){
    const ids=S.me.clinics.map(c=>c.id);

    return rows.filter(r=>ids.includes(r.bookings?.shifts?.clinic_id)).map(r=>({...r, booking:r.bookings, shift:{...r.bookings.shifts, clinic_name:r.bookings.shifts.clinics?.name}, clinician_name:r.bookings.clinicians?.profiles?.full_name||"Physician", invoice:first(r.bookings.invoices)}));
  },
  async approve(tid){ chk(await sb.rpc("approve_timesheet",{p_timesheet:tid})); },
  async dispute(tid,reason){ chk(await sb.rpc("dispute_timesheet",{p_timesheet:tid,p_reason:reason})); },
  async markPaid(iid){ chk(await sb.rpc("mark_invoice_paid",{p_invoice:iid})); },
  async pendingCredentials(){ const r=chk(await sb.from("credentials").select("*, clinicians(profiles(full_name))").eq("verification_status","pending").order("created_at")); return r.map(c=>({...c, clinician_name:c.clinicians?.profiles?.full_name||"Physician"})); },
  async verify(id,status,source){ chk(await sb.from("credentials").update({verification_status:status, verification_source:source}).eq("id",id)); }
};

async function vShifts(el){
  const rows = await api().shiftBoard(); if(!el.isConnected) return;
  const f=S.filt;
  let list = rows.slice();
  if(f.prov!=="all") list=list.filter(s=>s.province===f.prov);
  if(f.only) list=list.filter(s=>s.eligibility.level!=="bad");
  list.sort((a,b)=> f.sort==="net" ? b.net_estimate-a.net_estimate : f.sort==="day" ? b.net_estimate/b.days-a.net_estimate/a.days : a.start_date.localeCompare(b.start_date));
  if(!list.find(s=>s.id===S.sel)) S.sel = list[0]?.id || null;
  const sel = list.find(s=>s.id===S.sel);
  const provs=[...new Set(rows.map(s=>s.province))].sort();
  const bookable=rows.filter(s=>s.eligibility.level!=="bad").length;
  el.innerHTML = `
    <div class="page-h"><div><h1>${t("t_shifts")}</h1><p>${S.lang==="fr"?"Chaque remplacement est vérifié selon vos permis, votre ACPM et vos formations.":"Every shift is checked against your licences, CMPA cover and courses."}</p></div></div>
    <div class="toolbar">
      <label class="sr" for="f-prov">Province</label>
      <select id="f-prov"><option value="all">${S.lang==="fr"?"Toutes les provinces":"All provinces"}</option>${provs.map(p=>`<option value="${p}" ${f.prov===p?"selected":""}>${esc(provName(p))}</option>`).join("")}</select>
      <label class="sr" for="f-sort">Sort</label>
      <select id="f-sort"><option value="date" ${f.sort==="date"?"selected":""}>${S.lang==="fr"?"Date de début":"Soonest first"}</option><option value="net" ${f.sort==="net"?"selected":""}>${S.lang==="fr"?"Revenu net le plus élevé":"Highest take-home"}</option><option value="day" ${f.sort==="day"?"selected":""}>${S.lang==="fr"?"Revenu par jour":"Take-home per day"}</option></select>
      <label class="tgl" for="f-only"><input type="checkbox" id="f-only" ${f.only?"checked":""}>${S.lang==="fr"?"Seulement ceux que je peux réserver":"Only shifts I can book"}</label>
      <span class="count">${S.lang==="fr"?`${bookable} sur ${rows.length} réservables`:`${bookable} of ${rows.length} bookable`}</span>
    </div>
    ${list.length ? `<div class="sv">
      <div class="sv-list" role="listbox" aria-label="Shifts">${list.map(s=>`
        <button class="row" role="option" data-sel="${s.id}" aria-selected="${s.id===S.sel}">
          ${ICON[s.eligibility.level]}
          <span class="t">${esc(s.clinic_name)}${s.urgent?`<span class="flag">Urgent</span>`:""}</span>
          <span class="s">${esc(s.city)}, ${esc(s.province)}. ${frange(s.start_date,s.end_date)}</span>
          <span class="r num"><b>${money(s.net_estimate)}</b><span>${s.days} ${s.days>1?(S.lang==="fr"?"jours":"days"):(S.lang==="fr"?"jour":"day")}</span></span>
        </button>`).join("")}</div>
      <div class="sv-detail">${sel?shiftDetail(sel):""}</div>
    </div>` : `<div class="empty"><p>${S.lang==="fr"?"Aucun remplacement ne correspond à ces filtres.":"No shifts match these filters."}</p><button class="btn" id="f-clear">${S.lang==="fr"?"Effacer les filtres":"Clear filters"}</button></div>`}`;
  $("f-prov").onchange=e=>{f.prov=e.target.value;render();};
  $("f-sort").onchange=e=>{f.sort=e.target.value;render();};
  $("f-only").onchange=e=>{f.only=e.target.checked;render();};
  if($("f-clear")) $("f-clear").onclick=()=>{f.prov="all";f.only=false;render();};
  el.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{S.sel=b.dataset.sel;render();});
  const bk=$("book"); if(bk){ const ag=$("agree"); ag.onchange=()=>bk.disabled=!ag.checked; bk.onclick=()=>doBook(sel); }
}

async function doBook(s){
  try{ await api().book(s.id); toast(s.eligibility.level==="warn" ? (S.lang==="fr"?"Remplacement réservé en attente.":"Shift held. It confirms when the outstanding item is cleared.") : (S.lang==="fr"?"Réservé. L’entente est signée.":"Booked. The agreement is signed.")); go("bookings"); }

}

function credState(c){
  const fr=S.lang==="fr";
  if(c.verification_status==="pending") return ["warn",fr?"Vérification en cours":"Being verified"];
  if(c.verification_status==="rejected") return ["bad",fr?"Refusé":"Not accepted"];
  if(c.verification_status==="expired") return ["bad",fr?"Expiré":"Expired"];
  if(!c.expires_on) return ["ok",fr?"Vérifié":"Verified"];
  const d=Math.round((d8(c.expires_on)-d8(today()))/864e5);
  if(d<0) return ["bad",fr?"Expiré":"Expired"];
  if(d<=45) return ["warn",fr?`Expire dans ${d} jours`:`Expires in ${d} days`];
  return ["ok",fr?"Vérifié":"Verified"];
}

    <div class="field"><label for="cl-prov">Province</label><select id="cl-prov">${Object.keys(PROV).map(p=>`<option value="${p}" ${p==="ON"?"selected":""}>${esc(provName(p))}</option>`).join("")}</select></div>
    <div class="field full"><label for="cl-emr">${fr?"DME":"EMR"}</label><select id="cl-emr">${EMRS.map(e=>`<option>${e}</option>`).join("")}</select></div>
  </div><p class="err" id="cl-err" hidden></p><div><button class="btn primary" type="submit">${fr?"Créer la clinique":"Create clinic"}</button></div></form>`;
}
function bindClinicSetup(){
  $("cl-form").onsubmit=async e=>{ e.preventDefault(); const name=$("cl-name").value.trim(), city=$("cl-city").value.trim();
    if(!name||!city){ $("cl-err").textContent=S.lang==="fr"?"Indiquez le nom et la ville.":"Enter the clinic’s name and city."; $("cl-err").hidden=false; return; }
    try{ await api().createClinic({name,city,province:$("cl-prov").value,default_emr:$("cl-emr").value}); toast(S.lang==="fr"?"Clinique créée.":"Clinic created."); render(); }catch(err){ $("cl-err").textContent=err.message; $("cl-err").hidden=false; } };
}
function postDialog(){
  const fr=S.lang==="fr", cl=S.me.clinics;
  const d=new Date(d8(today()).getTime()+14*864e5).toLocaleDateString("en-CA"), d2=new Date(d8(today()).getTime()+18*864e5).toLocaleDateString("en-CA");
  openDialog(`<h2>${t("post")}</h2><div class="form-grid">
    ${cl.length>1?`<div class="field full"><label for="p-cl">${fr?"Clinique":"Clinic"}</label><select id="p-cl">${cl.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>`:""}
    <div class="field"><label for="p-a">${fr?"Début":"Start date"}</label><input type="date" id="p-a" value="${d}"></div>
    <div class="field"><label for="p-b">${fr?"Fin":"End date"}</label><input type="date" id="p-b" value="${d2}"></div>
    <div class="field"><label for="p-m">${fr?"Mode de rémunération":"Pay model"}</label><select id="p-m"><option value="per_diem">${fr?"Tarif journalier garanti":"Guaranteed per diem"}</option><option value="ffs">${fr?"À l’acte, moins les frais":"Fee-for-service minus overhead"}</option></select></div>
    <div class="field"><label for="p-r" id="p-r-l">${fr?"Tarif journalier ($)":"Daily rate ($)"}</label><input type="number" id="p-r" min="0" value="1400"></div>
    <div class="field" id="p-oh-f" hidden><label for="p-oh">${fr?"Frais (%)":"Overhead (%)"}</label><input type="number" id="p-oh" min="0" max="60" value="30"></div>
    <div class="field"><label for="p-tr">${fr?"Allocation de déplacement ($)":"Travel allowance ($)"}</label><input type="number" id="p-tr" min="0" value="0"></div>
    <div class="field"><label for="p-emr">${fr?"DME":"EMR"}</label><select id="p-emr">${EMRS.map(e=>`<option ${e===(cl[0]?.default_emr)?"selected":""}>${e}</option>`).join("")}</select></div>
    <div class="field full"><label for="p-scope">${fr?"Portée de la pratique":"Scope of practice"}</label><textarea id="p-scope" rows="2">${fr?"Pratique familiale complète, tous âges.":"Full-scope family practice, all ages."}</textarea></div>
    <label class="tgl" for="p-oc"><input type="checkbox" id="p-oc">${fr?"Inclut la garde":"Includes on-call"}</label>
    <label class="tgl" for="p-ac"><input type="checkbox" id="p-ac">${fr?"ACLS requis":"ACLS required"}</label>
    <label class="tgl" for="p-ur"><input type="checkbox" id="p-ur">${fr?"Urgent":"Urgent"}</label>
    <label class="tgl" for="p-bk"><input type="checkbox" id="p-bk" checked>${fr?"Offrir d’abord à ma banque pendant 24 h":"Offer to my locum bank first for 24 hours"}</label>
  </div><p class="err" id="p-err" hidden></p>
  <div class="dlg-actions"><button class="btn" id="p-no">${fr?"Annuler":"Cancel"}</button><button class="btn primary" id="p-yes">${fr?"Publier":"Publish shift"}</button></div>`, ()=>{
    $("p-m").onchange=e=>{ const ffs=e.target.value==="ffs"; $("p-oh-f").hidden=!ffs; $("p-r-l").textContent= ffs?(fr?"Facturation estimée ($)":"Estimated billings ($)"):(fr?"Tarif journalier ($)":"Daily rate ($)"); $("p-r").value= ffs?9000:1400; };
    $("p-no").onclick=closeDialog;
    $("p-yes").onclick=async()=>{ const err=m=>{ $("p-err").textContent=m; $("p-err").hidden=false; };
      const a=$("p-a").value, b=$("p-b").value, m=$("p-m").value, v=Number($("p-r").value);
      if(!a||!b||b<a) return err(fr?"La date de fin doit suivre la date de début.":"The end date must be on or after the start date.");
      if(!(v>0)) return err(fr?"Indiquez un montant.":"Enter the pay amount.");
      const clinic_id = $("p-cl") ? $("p-cl").value : cl[0].id;
      const x={clinic_id,start_date:a,end_date:b,pay_model:m,daily_rate:m==="per_diem"?v:null,est_billings:m==="ffs"?v:null,overhead_pct:m==="ffs"?Number($("p-oh").value):null,
        travel_allowance:Number($("p-tr").value)||0,emr:$("p-emr").value,scope:$("p-scope").value.trim()||"Family practice",on_call:$("p-oc").checked,requires_acls:$("p-ac").checked,urgent:$("p-ur").checked,
        language:S.lang==="fr"&&cl.find(c=>c.id===clinic_id)?.province==="QC"?"fr":"en", bank_only_until:$("p-bk").checked?new Date(Date.now()+864e5).toISOString():null};
      try{ await api().postShift(x); closeDialog(); toast(fr?"Remplacement publié.":"Shift published."); S.cshift=null; render(); }catch(e){ err(e.message); } };
  });
}
async function vClinicTime(el){
  const rows = await api().clinicTimesheets(), fr=S.lang==="fr"; if(!el.isConnected) return;
  const pend=rows.filter(r=>r.status==="submitted"), done=rows.filter(r=>r.status!=="submitted");
  const amt = r => { const a=r.booking.agreement||{}; return Math.round(((a.pay_model==="per_diem")?a.daily_rate*r.days_worked:(r.billings_reported||0)*(1-(a.overhead_pct||0)/100))+(a.travel_allowance||0)); };
  el.innerHTML = `<div class="page-h"><div><h1>${t("t_ctime")}</h1><p>${fr?"Approuver une feuille de temps émet la facture selon l’entente signée.":"Approving a timesheet issues the invoice on the signed agreement’s terms."}</p></div></div>
    <div class="group" style="margin-top:0"><h2>${fr?"À approuver":"Waiting for you"}</h2>
    ${pend.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${fr?"Médecin":"Physician"}</th><th>${fr?"Remplacement":"Shift"}</th><th>${fr?"Jours":"Days"}</th><th class="r">${fr?"Montant":"Amount"}</th><th></th></tr></thead><tbody>
      ${pend.map(r=>`<tr><td><b>${esc(r.clinician_name)}</b>${r.notes?`<div class="sub">${esc(r.notes)}</div>`:""}${r.early_pay_requested?`<div class="sub">${fr?"Paiement le lendemain demandé":"Next-day pay requested"}</div>`:""}</td><td>${esc(r.shift.clinic_name)}<div class="sub">${frange(r.shift.start_date,r.shift.end_date)}</div></td><td class="num">${r.days_worked}</td><td class="r num">${money(amt(r))}</td>
        <td><div class="actions"><button class="btn sm" data-dis="${r.id}">${fr?"Demander une correction":"Ask for a correction"}</button><button class="btn sm primary" data-ap="${r.id}">${fr?"Approuver":"Approve"}</button></div></td></tr>`).join("")}</tbody></table></div>`
      :`<div class="tbl-wrap"><div class="empty"><p>${fr?"Rien à approuver.":"Nothing to approve."}</p></div></div>`}</div>
    <div class="group"><h2>${fr?"Traitées":"Handled"}</h2>
    ${done.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${fr?"Médecin":"Physician"}</th><th>${fr?"Facture":"Invoice"}</th><th class="r">${fr?"Montant":"Amount"}</th><th>${fr?"Statut":"Status"}</th><th></th></tr></thead><tbody>
      ${done.map(r=>{ const i=r.invoice; return `<tr><td><b>${esc(r.clinician_name)}</b><div class="sub">${frange(r.shift.start_date,r.shift.end_date)}</div></td><td>${i?esc(i.number):"—"}</td><td class="r num">${i?money(i.net_amount):"—"}</td>
        <td>${r.status==="disputed"?`<span class="tag warn">${ICON.warn}${fr?"Correction demandée":"Correction requested"}</span>`:i&&i.paid_at?`<span class="tag ok">${ICON.ok}${fr?"Payée":"Paid"} ${fdate(i.paid_at)}</span>`:`<span class="tag info">${ICON.info}${fr?"Due le":"Due"} ${fdate(i?.due_on)}</span>`}</td>
        <td><div class="actions">${i&&!i.paid_at?`<button class="btn sm" data-paid="${i.id}">${fr?"Marquer payée":"Mark paid"}</button>`:""}</div></td></tr>`; }).join("")}</tbody></table></div>`
      :`<div class="tbl-wrap"><div class="empty"><p>${fr?"Aucune pour l’instant.":"None yet."}</p></div></div>`}</div>`;
  el.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await api().approve(b.dataset.ap); toast(fr?"Approuvée. Facture émise.":"Approved. Invoice issued."); render(); }catch(e){ b.disabled=false; toast(e.message); } });
  el.querySelectorAll("[data-paid]").forEach(b=>b.onclick=async()=>{ try{ await api().markPaid(b.dataset.paid); toast(fr?"Facture marquée payée.":"Invoice marked paid."); render(); }catch(e){ toast(e.message); } });
  el.querySelectorAll("[data-dis]").forEach(b=>b.onclick=()=>openDialog(`<h2>${fr?"Demander une correction":"Ask for a correction"}</h2><div class="field"><label for="ds">${fr?"Ce qui doit être corrigé":"What needs correcting"}</label><textarea id="ds" rows="3"></textarea></div><p class="err" id="ds-err" hidden></p>
    <div class="dlg-actions"><button class="btn" id="dsn">${fr?"Annuler":"Cancel"}</button><button class="btn primary" id="dsy">${fr?"Envoyer":"Send to physician"}</button></div>`,()=>{
      $("dsn").onclick=closeDialog; $("dsy").onclick=async()=>{ try{ await api().dispute(b.dataset.dis,$("ds").value); closeDialog(); toast(fr?"Demande envoyée.":"Sent to the physician."); render(); }catch(e){ $("ds-err").textContent=e.message; $("ds-err").hidden=false; } }; }));
}

/* ============ Admin ============ */
async function vVerify(el){
  const rows = await api().pendingCredentials(), fr=S.lang==="fr"; if(!el.isConnected) return;
  el.innerHTML = `<div class="page-h"><div><h1>${t("t_verify")}</h1><p>${fr?"Vérifiez chaque titre auprès de la source primaire avant de l’approuver.":"Check each credential against its primary source before accepting it."}</p></div></div>
    ${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${fr?"Médecin":"Physician"}</th><th>${fr?"Titre":"Credential"}</th><th>${fr?"Numéro":"Reference"}</th><th>${fr?"Expiration":"Expires"}</th><th></th></tr></thead><tbody>
    ${rows.map(c=>`<tr><td><b>${esc(c.clinician_name)}</b></td><td>${esc(c.label)}<div class="sub">${CTYPE[c.type][fr?1:0]}${c.province?", "+esc(c.province):""}</div></td><td>${esc(c.reference||"—")}</td><td>${c.expires_on?fdate(c.expires_on,{day:"numeric",month:"short",year:"numeric"}):"—"}</td>
      <td><div class="actions"><button class="btn sm" data-rej="${c.id}">${fr?"Refuser":"Not accepted"}</button><button class="btn sm primary" data-ver="${c.id}" data-src="${esc(c.province&&PROV[c.province]?PROV[c.province].college+" public register":"Document reviewed")}">${fr?"Vérifié":"Mark verified"}</button></div></td></tr>`).join("")}
    </tbody></table></div>`:`<div class="tbl-wrap"><div class="empty"><p>${fr?"Aucun titre en attente.":"No credentials waiting."}</p></div></div>`}`;
  el.querySelectorAll("[data-ver]").forEach(b=>b.onclick=async()=>{ try{ await api().verify(b.dataset.ver,"verified",b.dataset.src); toast(fr?"Titre vérifié.":"Marked verified."); render(); }catch(e){ toast(e.message); } });
  el.querySelectorAll("[data-rej]").forEach(b=>b.onclick=async()=>{ try{ await api().verify(b.dataset.rej,"rejected",null); toast(fr?"Titre refusé.":"Marked not accepted."); render(); }catch(e){ toast(e.message); } });
}

/* ============ Render ============ */
const VIEWS = { shifts:vShifts, bookings:vBookings, pay:vPay, creds:vCreds, account:vAccount, cshifts:vClinicShifts, ctime:vClinicTime, verify:vVerify };
let renderSeq=0;
async function render(){
  const my=++renderSeq;
  document.documentElement.lang = S.lang==="fr" ? "fr-CA" : "en-CA";
  const root=$("root");
  if(S.mode==="checking"){ root.innerHTML = topBar()+`<main>${vHome()}</main>`; bindTop(); wirePhotos(); return; }
  if(VIEWS[S.route]){
    if(!S.me){ S.route="signin"; }
    else if(!APP_ROUTES[S.me.role].includes(S.route)){ S.route=homeRouteFor(S.me); }
  }
  if(S.route==="signin"){ root.innerHTML = topBar()+`<main>${vSignin()}</main>`; bindTop(); bindSignin(); wirePhotos(); return; }
  if(!VIEWS[S.route]){ root.innerHTML = topBar()+`<main>${vHome()}</main>`; bindTop(); wirePhotos(); return; }
  root.innerHTML = topBar()+`<main class="app"><div class="wrap" id="view"><div class="loading">${S.lang==="fr"?"Chargement…":"Loading…"}</div></div></main>`;
  bindTop();
  const v=$("view");
  try{ await VIEWS[S.route](v); }
  catch(e){ if(my!==renderSeq) return; v.innerHTML=`<div class="empty"><p>${esc(e.message)}</p><button class="btn" id="retry">${S.lang==="fr"?"Réessayer":"Try again"}</button></div>`; $("retry").onclick=render; }
}

function bindTop(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-scroll]").forEach(b=>b.onclick=()=>{ S.navOpen=false; const go2=()=>document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); if(S.route!=="home"){ S.route="home"; render().then?.(go2); setTimeout(go2,30);} else go2(); });
  document.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>{ if(S.me){ go(homeRouteFor(S.me)); return; } S.authTab= S.mode==="live" ? "up" : "in"; S.authRole=b.dataset.auth; go("signin"); });
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ S.lang=b.dataset.lang; try{ localStorage.setItem("releve.lang",S.lang); }catch(e){} render(); });
  if($("menu")) $("menu").onclick=()=>{ S.navOpen=!S.navOpen; render(); };
  if($("signout")) $("signout").onclick=async()=>{ await api().signOut(); go("home"); };
  if($("signout-m")) $("signout-m").onclick=async()=>{ await api().signOut(); go("home"); };
  if($("demo-exit")) $("demo-exit").onclick=async()=>{ await DemoAPI.signOut(); go("home"); };
}
function bindSignin(){
  $("tab-in").onclick=()=>{ S.authTab="in"; render(); };
  $("tab-up").onclick=()=>{ S.authTab="up"; render(); };
  if($("r-c")){ $("r-c").onclick=()=>{ S.authRole="clinician"; render(); }; $("r-k").onclick=()=>{ S.authRole="clinic_admin"; render(); }; }
  $("auth-form").onsubmit=async e=>{ e.preventDefault(); const er=$("a-err"), ok=$("a-ok"); er.hidden=true; ok.hidden=true;
    const email=$("a-email").value.trim(), pw=$("a-pw").value, fr=S.lang==="fr";
    if(!email||!pw){ er.textContent=fr?"Entrez votre courriel et votre mot de passe.":"Enter your email and password."; er.hidden=false; return; }
    try{
      if(S.authTab==="up"){ const name=$("a-name").value.trim(); if(!name){ er.textContent=fr?"Entrez votre nom.":"Enter your name."; er.hidden=false; return; }
        if(pw.length<8){ er.textContent=fr?"Le mot de passe doit compter au moins 8 caractères.":"Use at least 8 characters for your password."; er.hidden=false; return; }
        await api().signUp(email,pw,name,S.authRole); ok.textContent=fr?"Vérifiez vos courriels pour confirmer votre compte.":"Check your email to confirm your account, then sign in."; ok.hidden=false; }
      else { await api().signIn(email,pw); go(homeRouteFor(S.me)); }
    }catch(err){ er.textContent=err.message; er.hidden=false; } };
  document.querySelectorAll("[data-persona]").forEach(b=>b.onclick=async()=>{ S.mode="demo"; D=demoSeed(); await DemoAPI.demoAs(b.dataset.persona); go(homeRouteFor(S.me)); });
}

/* ============ Boot ============ */
async function detectBackend(){
  if(!window.supabase) return false;
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch(CONFIG.url+"/auth/v1/health",{headers:{apikey:CONFIG.key},signal:ctl.signal}); clearTimeout(tm);
    return r.ok;
  }catch(e){ return false; }
}
(async function boot(){
  const h=(location.hash||"").slice(1); if(h) S.route=h;
  render();
  const live = await detectBackend();
  if(live){
    S.mode="live";
    sb = window.supabase.createClient(CONFIG.url, CONFIG.key, {auth:{persistSession:true,autoRefreshToken:true}});
    try{ S.me = await LiveAPI.loadMe(); }catch(e){ S.me=null; }
    sb.auth.onAuthStateChange(async (ev)=>{ if(ev==="SIGNED_OUT"){ S.me=null; render(); } });
  } else {
    S.mode="demo";
  }
  render();
})();
</script>
